<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arayas Cheat Shop</title>
    <style>
        /* Черный фон и шрифты */
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Экран приветствия */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Большой красный самурай (арт/картинка) */
        .samurai-logo {
            font-size: 120px;
            color: #ff2a2a;
            text-shadow: 0 0 30px rgba(255, 42, 42, 0.6);
            margin-bottom: 20px;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        /* Оранжевая кнопка ДАЛЕЕ */
        .orange-btn {
            background: linear-gradient(45deg, #ff6a00, #ee0979);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 106, 0, 0.4);
            transition: 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .orange-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 106, 0, 0.6);
        }

        /* Главная панель (скрыта изначально) */
        .main-panel {
            display: none;
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Меню сверху: Профиль, Поддержка, Баланс */
        .top-menu {
            display: flex;
            justify-content: space-around;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #333;
            margin-bottom: 30px;
        }

        .menu-btn {
            background: transparent;
            color: #bbb;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            padding: 5px 15px;
        }

        .menu-btn:hover {
            color: #ff6a00;
        }

        /* Большая рамка для поиска и товаров */
        .main-box {
            background: #141414;
            border: 2px solid #ff2a2a;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 0 25px rgba(255, 42, 42, 0.15);
            text-align: center;
        }

        /* Поле ввода названия чита */
        .cheat-input {
            width: 100%;
            max-width: 500px;
            background: #222;
            border: 1px solid #444;
            padding: 15px;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
            margin-bottom: 40px;
            text-align: center;
        }

        .cheat-input:focus {
            border-color: #ff6a00;
            box-shadow: 0 0 10px rgba(255, 106, 0, 0.3);
        }

        /* Секция под будущие товары */
        .products-section {
            border-top: 1px dashed #333;
            padding-top: 20px;
        }

        .products-title {
            color: #888;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .placeholder-text {
            color: #555;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- 1. ЭКРАН ПРИВЕТСТВИЯ -->
    <div class="welcome-screen" id="welcomeScreen">
        <!-- Вместо эмодзи самурая потом сможешь вставить картинку <img> -->
        <div class="samurai-logo">🥷</div>
        <button class="orange-btn" onclick="showMainPanel()">Далее</button>
    </div>

    <!-- 2. ГЛАВНАЯ ПАНЕЛЬ С КНОПКАМИ И РАМКОЙ -->
    <div class="main-panel" id="mainPanel">
        
        <!-- Верхнее меню -->
        <div class="top-menu">
            <button class="menu-btn" onclick="alert('Профиль в разработке')">👤 Профиль</button>
            <button class="menu-btn" onclick="alert('Ссылка на поддержку')">💬 Поддержка</button>
            <button class="menu-btn" onclick="alert('Баланс: 0 руб.')">💳 Баланс</button>
        </div>

        <!-- Большая рамка -->
        <div class="main-box">
            <input type="text" class="cheat-input" placeholder="Введите название чита...">
            
            <!-- Место под твои будущие товары -->
            <div class="products-section">
                <div class="products-title">Витрина товаров</div>
                <div class="placeholder-text">[ Место для товаров, которые ты скинешь позже ]</div>
            </div>
        </div>

    </div>

    <script>
        // Функция переключения экранов по нажатию "Далее"
        function showMainPanel() {
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('mainPanel').style.display = 'block';
        }
    </script>
</body>
</html>
